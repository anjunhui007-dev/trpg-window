<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>네모네모 로직</title><style>
:root{font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:#334155;background:#f2f5fb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 5%,#e2eafd 0,transparent 36%),radial-gradient(circle at 8% 72%,#e9f5f1 0,transparent 42%),#f5f7fb;min-height:100vh}header{background:#ffffffdd;backdrop-filter:blur(14px);border-bottom:1px solid #e5eaf2;padding:20px 26px;display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0}.shell{max-width:1000px;margin:28px auto;padding:0 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;border:1px solid #dce3ed;background:white;border-radius:12px;padding:11px 15px;cursor:pointer;color:#34445d;transition:background .15s,border-color .15s,transform .12s}button.active{background:#475e84;color:white;border-color:#475e84;box-shadow:0 4px 10px #475e842b}button:disabled{opacity:.45}button:hover{border-color:#6e829e}.panel{background:#ffffffee;border:1px solid #e4eaf4;border-radius:26px;padding:26px;box-shadow:0 18px 55px #3c527017}.levels{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 14px}.puzzles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}.puzzles button{min-width:48px;font-weight:650}.puzzles button.done{background:#dcfce7;color:#166534}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.layout{display:flex;gap:28px;flex-wrap:wrap;align-items:start}.game{max-width:100%;overflow:auto;touch-action:pan-x pan-y}.board{display:grid;grid-template-columns:86px repeat(var(--n),var(--cell));grid-template-rows:86px repeat(var(--n),var(--cell));width:max-content;user-select:none}.corner{grid-column:1;grid-row:1}.clue{display:flex;align-items:center;justify-content:end;font-size:clamp(10px,2vw,13px);font-weight:650;color:#48546b;gap:3px}.clue.col{flex-direction:column;justify-content:end;padding-bottom:5px}.clue.row{padding-right:7px}.clue.complete{color:#48546b}.cell{width:var(--cell);height:va </style></head><body><header><h1>▦ 네모네모 로직</h1><span class="stat">PICROSS COLLECTION</span></header><main class="shell"><div class="panel"><div class="top"><div><h2 style="margin:0">퍼즐 선택</h2><p class="muted">숫자를 따라 칸을 채우면 숨겨진 그림이 나타나요.</p></div><span id="summary" class="stat"></span></div><div id="levels" class="levels"></div><div id="puzzles" class="puzzles"></div><div class="layout"><section class="game"><div id="board" class="board"></div></section><aside class="side"><h3 id="puzzleTitle">퍼즐</h3><div class="stat" id="counter"></div><div class="progress"><div id="bar"></div></div><div class="instruction">👆 한 번 터치: ■ 색칠 → 두 번: × 표시 → 세 번: 지우기</div><div class="actions"><button id="verify">정답 확인</button><button id="hint">힌트 3회</button><button id="reset">초기화</button></div><div id="message" class="message" aria-live="polite"></div><p class="muted">별도의 도구 선택 없이 같은 칸을 반복해서 터치하세요. 연속된 칸의 개수가 숫자로 표시됩니다. 숫자 사이에는 최소 한 칸을 비워야 합니다. 연속 칸 수가 숫자와 일치하면 회색 취소선, 초과하면 빨간색으로 표시됩니다.</p></aside></div></div></main><footer>NONOGRAM · 로컬 자동 저장</footer><script src="./game.js?v=20261014-complete-green"></script></body></html>
