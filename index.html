<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15100b"><title>TRPG Window</title><link rel="stylesheet" href="styles.css?v=9"></head><body><main class="game-shell">
<header class="topbar"><button id="homeBtn" class="brand-button"><p>CHRONICLE</p><h1>TRPG WINDOW</h1></button><div class="worldline"><span id="dayText">DAY 1</span><div class="place-wallet"><b id="locationText">장소 미정</b><small id="goldText">소지금 0 G</small></div><button id="editBtn" class="rune-btn">✦</button></div></header>
<section class="speaker-stage"><div class="stage-label">현재 대화</div><div id="speakerRow" class="speaker-row"></div></section>
<section class="status-strip"><div class="player-seal"><div id="playerAvatar" class="seal">?</div><div><strong id="playerName">이름 없음</strong><small id="playerMeta">Lv. 1 · 모험가</small></div></div><div class="meters"><div class="meterline"><span>HP</span><div class="meter hp"><i id="hpBar"></i></div><b id="hpText">10 / 10</b></div><div class="meterline"><span>SP</span><div class="meter sp"><i id="spBar"></i></div><b id="spText">10 / 10</b></div><div class="meterline"><span>EXP</span><div class="meter exp"><i id="expBar"></i></div><b id="expText">0 / 100</b></div></div><div class="quick-icons"><button data-tab="stats"><i>◇</i><span>스탯</span></button><button data-tab="trait"><i>✦</i><span>특성</span></button><button data-tab="skills"><i>✧</i><span>스킬</span></button></div></section>
<section class="world-stage"><div id="mapLayer" class="map-layer"><div id="mapCanvas" class="map-canvas"></div><div class="map-title"><small>CURRENT AREA</small><strong id="mapLocation">장소 미정</strong></div><button id="mapMenuBtn" class="map-menu" type="button" aria-label="지도 메뉴">☰</button><aside id="mapInfo" class="map-info"><small>REGION</small><strong>아르켈리온 대륙</strong><p>지역 표식을 선택하면 이곳에 설명이 기록됩니다.</p></aside></div></section>
<aside id="sideRail" class="side-rail"><button id="railToggle" class="rail-toggle" type="button" aria-label="메뉴 접기"><span>›</span></button><nav class="side-nav"><button data-tab="people"><i>♟</i><span>인물</span></button><button data-tab="equipment"><i>⚔</i><span>장비</span></button><button data-tab="essence"><i>◆</i><span>정수</span></button><button data-tab="inventory"><i>▣</i><span>소지품</span></button><button data-tab="settings"><i>⚙</i><span>설정</span></button></nav></aside>
<div id="modalBackdrop" class="modal-backdrop hidden"><section id="gameModal" class="game-modal" role="dialog" aria-modal="true"><div class="modal-head"><strong id="modalTitle">인물</strong><button id="closeModal" type="button" aria-label="닫기">×</button></div><div id="modalBody" class="modal-body"></div></section></div></main>
<dialog id="editDialog"><form id="editForm" method="dialog" class="dialog-card"><div class="dialog-head"><strong>게임 상태 테스트</strong><button value="cancel">×</button></div><label>이름<input name="name"></label><div class="two"><label>레벨<input name="level" type="number" min="1" max="70"></label><label>등급/직업<input name="title"></label></div><label>현재 EXP<input name="exp" type="number" min="0"></label><div class="two"><label>HP<input name="hp" type="number" min="0"></label><label>최대 HP<input name="maxHp" type="number" min="1"></label></div><div class="two"><label>SP<input name="sp" type="number" min="0"></label><label>최대 SP<input name="maxSp" type="number" min="1"></label></div><label>현재 장소<input name="location"></label><label>소지금 (G)<input name="gold" type="number" min="0"></label><label>Day<input name="day" type="number" min="1"></label><div class="test-grants"><button type="button" id="grantTestWeapon">테스트용 무기 지급</button><button type="button" id="grantTestEssence">테스트용 정수 지급</button></div><button class="primary" value="default">저장</button></form></dialog><input id="saveImportInput" type="file" accept="application/json,.json" hidden><script src="app.js?v=9"></script></body></html>
