<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>네모네모 로직</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#283344;background:#f5f6fa}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #e2e6ef;padding:18px 24px;display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0}.shell{max-width:1000px;margin:28px auto;padding:0 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;border:1px solid #d6dce6;background:white;border-radius:10px;padding:10px 14px;cursor:pointer;color:#293449}button.active{background:#293e59;color:white}button:disabled{opacity:.45}button:hover{border-color:#6e829e}.panel{background:white;border:1px solid #e3e8f0;border-radius:18px;padding:22px;box-shadow:0 8px 30px #2734490a}.levels{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.puzzles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}.puzzles button{min-width:46px}.puzzles button.done{background:#dcfce7}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.layout{display:flex;gap:28px;flex-wrap:wrap;align-items:start}.game{max-width:100%;overflow:auto;touch-action:pan-x pan-y}.board{display:grid;grid-template-columns:86px repeat(var(--n),var(--cell));grid-template-rows:86px repeat(var(--n),var(--cell));width:max-content;user-select:none}.corner{grid-column:1;grid-row:1}.clue{display:flex;align-items:center;justify-content:end;font-size:clamp(10px,2vw,13px);font-weight:650;color:#48546b;gap:3px}.clue.col{flex-direction:column;justify-content:end;padding-bottom:5px}.clue.row{padding-right:7px}.clue.complete{color:#16a34a}.cell{width:var(--cell);height:var(--cell);border:0;border-right:1px solid #cad2de;border-bottom:1px solid #cad2de;border-radius:0;padding:0;background:#fff;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell)*.65);color:#a1aab7;touch-action:manipulation}.cell.filled{background:#344862}.cell.wrong{background:#f8b4b4}.cell:nth-child(5n){border-right-color:#cad2de}.cell.edgeleft{border-left:2px solid #62728a}.cell.edgetop{border-top:2px solid #62728a}.cell.edgeright{border-right:2px solid #62728a}.cell.edgebottom{border-bottom:2px solid #62728a}.side{min-width:200px;flex:1;max-width:300px}.stat{font-size:14px;color:#64748b}.message{margin:16px 0;min-height:26px;font-weight:650}.muted{color:#64748b;font-size:13px;line-height:1.6}.progress{height:7px;background:#edf1f6;border-radius:8px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:#344862;transition:width .2s}.actions{display:flex;gap:8px;flex-wrap:wrap}footer{text-align:center;padding:28px;color:#8a96a8;font-size:12px}@media(max-width:600px){.shell{margin:12px auto;padding:0 9px}.panel{padding:12px}.board{grid-template-columns:60px repeat(var(--n),var(--cell));grid-template-rows:65px repeat(var(--n),var(--cell))}.clue{font-size:10px;gap:2px}.clue.row{padding-right:3px}.layout{gap:14px}.side{max-width:none}}
</style></head><body><header><h1>▦ 네모네모 로직</h1><span class="stat">PICROSS COLLECTION</span></header><main class="shell"><div class="panel"><div class="top"><div><h2 style="margin:0">퍼즐 선택</h2><p class="muted">숫자를 따라 칸을 채우면 숨겨진 그림이 나타나요.</p></div><span id="summary" class="stat"></span></div><div id="levels" class="levels"></div><div id="puzzles" class="puzzles"></div><div class="layout"><section class="game"><div id="board" class="board"></div></section><aside class="side"><h3 id="puzzleTitle">퍼즐</h3><div class="stat" id="counter"></div><div class="progress"><div id="bar"></div></div><div class="toolbar"><button data-mode="fill" class="active">■ 색칠</button><button data-mode="cross">× 빈칸</button><button data-mode="erase">지우개</button></div><div class="actions"><button id="verify">정답 확인</button><button id="hint">힌트 3회</button><button id="reset">초기화</button></div><div id="message" class="message" aria-live="polite"></div><p class="muted">연속된 칸의 개수가 숫자로 표시됩니다. 숫자 사이에는 최소 한 칸을 비워야 합니다. 완료된 줄은 초록색으로 표시됩니다.</p></aside></div></div></main><footer>NONOGRAM · 로컬 자동 저장</footer><script src="./game.js"></script></body></html>
